syntax = "proto3";

package mentor.admin.profile;

import "mentor/types/identity.proto";

// Админ-сервис управления профилями пользователей.
// Предоставляет администратору инструменты для поддержки и расследований.
service ProfileAdminService {
    // Получить полный профиль любого пользователя (для поддержки, расследований).
    // Доступ: только администратор.
    rpc GetUserProfile(GetUserProfileRequest) returns (UserProfileResponse);

    // Поиск пользователей по telegram_id или telegram_username.
    // Доступ: только администратор.
    rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
}

// --- Запросы и ответы ---

// Запрос на получение профиля пользователя.
message GetUserProfileRequest {
    // Идентификатор пользователя (distributor_id).
    uint32 distributor_id = 1;
}

// Расширенный профиль пользователя для админки.
// Агрегирует данные профиля и статистику по ботам/подпискам.
message UserProfileResponse {
    // Полный профиль пользователя.
    mentor.types.identity.UserProfile profile = 1;

    // Максимальное количество ботов, разрешённое автору.
    uint32 max_bots = 2;

    // Текущее количество созданных ботов.
    uint32 current_bot_count = 3;

    // Количество активных подписок.
    uint32 active_subscriptions_count = 4;
}

// Запрос на поиск пользователей.
// Поиск выполняется по одному из полей (приоритет: telegram_id > telegram_username).
message SearchUsersRequest {
    // Поиск по Telegram ID (точное совпадение).
    int64 telegram_id = 1;

    // Поиск по @username (точное совпадение, без @).
    string telegram_username = 2;
}

// Ответ со списком найденных пользователей.
message SearchUsersResponse {
    repeated mentor.types.identity.PublicUserProfile users = 1;
}


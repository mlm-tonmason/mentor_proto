syntax = "proto3";

package mentor.admin.profile;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// Админ-сервис управления шаблонами профилей.
service ProfileAdminService {
    // Шаблоны.
    rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
    rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse);
    rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);

    // Версионирование.
    rpc CreateTemplateVersion(CreateTemplateVersionRequest) returns (CreateTemplateVersionResponse);
    rpc GetTemplateVersion(GetTemplateVersionRequest) returns (GetTemplateVersionResponse);

    // Привязка к ботам.
    rpc BindBotToTemplate(BindBotToTemplateRequest) returns (BindBotToTemplateResponse);
}

// Шаблон профиля пользователя (схема данных для LLM).
// Определяет, какие поля бот должен заполнять о пользователе.
message UserProfileTemplate {
  string template_id = 1;    // Уникальный идентификатор шаблона.
  string display_name = 2;   // Человекочитаемое название.
  string description = 3;    // Описание назначения шаблона.
  string active_version = 4; // Текущая активная версия (семантическая).

  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// Версия шаблона профиля (конкретная схема).
message UserProfileTemplateVersion {
  string template_id = 1; // Ссылка на шаблон.
  string version = 2;     // Версия (например, "1.0.0").

  // Схема данных (JSON Schema или произвольная структура).
  // Определяет, какие поля бот должен извлекать из диалога.
  google.protobuf.Struct schema = 3;

  google.protobuf.Timestamp created_at = 4;
}

message CreateTemplateRequest {
    UserProfileTemplate template = 1;
}

message CreateTemplateResponse {
    UserProfileTemplate template = 1;
}

message UpdateTemplateRequest {
    UserProfileTemplate template = 1;
}

message UpdateTemplateResponse {
    UserProfileTemplate template = 1;
}

message ListTemplatesRequest {
    int32 page_size = 1;
    string page_token = 2;
}

message ListTemplatesResponse {
    repeated UserProfileTemplate items = 1;
    string next_page_token = 2;
}

message CreateTemplateVersionRequest {
    UserProfileTemplateVersion version = 1;
}

message CreateTemplateVersionResponse {
    UserProfileTemplateVersion version = 1;
}

message GetTemplateVersionRequest {
    string template_id = 1;
    string version = 2;
}

message GetTemplateVersionResponse {
    UserProfileTemplateVersion version = 1;
}

message BindBotToTemplateRequest {
    string bot_id = 1;
    string template_id = 2;
}

message BindBotToTemplateResponse {
    bool success = 1;
}

